services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["hugo", "server", "--bind=0.0.0.0", "--port=1313", "--baseURL=http://localhost", "--buildDrafts"]
    ports:
      - "1313:1313"
    volumes:
    - .:/src
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum
        - action: rebuild
          path: hugo.toml
        - action: rebuild
          path: themes
        - action: sync
          path: content
          target: /src/content
        - action: sync
          path: layouts
          target: /src/layouts
        - action: sync
          path: assets
          target: /src/assets
        - action: sync
          path: static
          target: /src/static
