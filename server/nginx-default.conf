server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Keamanan: Sembunyikan versi Nginx
    server_tokens off;

    # 2. Tangani Halaman 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 3. Optimasi Cache untuk Asset Statis (CSS, JS, Gambar WebP dari Sveltia)
    # Karena Hugo menghasilkan file statis dengan hash/nama tetap, cache jangka panjang sangat dianjurkan
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Routing Bersih untuk Hugo (Opsional: Mendukung URL tanpa ekstensi .html jika ada)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 5. Keamanan Tambahan: Blokir akses ke file tersembunyi (seperti .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 6. Kompresi Gzip untuk mempercepat muat halaman teks/html/json
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";
}
