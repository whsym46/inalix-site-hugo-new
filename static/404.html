<!DOCTYPE html>
<html>
  <head>
    <title>Page Not Found</title>
    <script>
      (function() {
        var path = window.location.pathname;
        // Redirect URL lama /en/... ke root /...
        if (path === '/en' || path === '/en/' || path.startsWith('/en/')) {
          var cleanPath = path.replace(/^\/en\/?/, '');
          window.location.replace('/' + cleanPath);
          return;
        }
        if (path.startsWith('/id/')) {
          window.location.replace('/id/404.html');
        } else {
          window.location.replace('/404.html');
        }
      })();
    </script>
    <meta http-equiv="refresh" content="1; url=/404.html" />
  </head>
  <body>
    <p>Page Not Found. Redirecting...</p>
  </body>
</html>
